name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and sign the test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify counting logic
        run: bash scripts/test-counting.sh
      - name: Compile, package and verify APKs
        run: |
          bash scripts/build-apk.sh
          bash scripts/build-permission-tests.sh
      - name: Share the same signed APKs with every emulator
        uses: actions/upload-artifact@v7.0.2
        with:
          name: timelens-test-bundle
          path: |
            build/sdk/TimeLens-*-debug.apk
            build/permission-tests/permission-tests.apk
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ${{ matrix.android.version }} verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        android:
          - {version: '15', api: '35'}
          - {version: '16', api: '36'}
          - {version: '17', api: '37.0'}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Use current SDK metadata tools
        run: |
          tools_path="$ANDROID_HOME/cmdline-tools"
          test -x "$tools_path/16111833/bin/avdmanager"
          if [[ -e "$tools_path/latest" || -L "$tools_path/latest" ]]; then
            mv "$tools_path/latest" "$tools_path/preinstalled-before-timelens"
          fi
          ln -s "$tools_path/16111833" "$tools_path/latest"
      - name: Download the signed app and instrumentation APKs
        uses: actions/download-artifact@v8.0.2
        with:
          name: timelens-test-bundle
          path: build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify permissions and the live timer
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          TIMELENS_TEST_APK_PREBUILT: 'true'
        with:
          api-level: ${{ matrix.android.api }}
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          avd-name: timelens-api-${{ matrix.android.api }}
          disk-size: 6G
          ram-size: 4096M
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          script: bash scripts/test-permissions-device.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: permission-test-evidence-android-${{ matrix.android.version }}
          path: build/permission-evidence/
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Publish the verified APK
    needs: [build, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: timelens-test-bundle
          path: build
      - name: Upload downloadable APK
        id: apk
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/sdk/TimeLens-*-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Add download link to run summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### TimeLens APK\n\n[Download the APK](%s)\n\nThe same signed APK passed counting checks and permission/live-timer tests on Android 15, 16 and 17.\n\nIf Usage access is restricted: App info → ⋮ → Allow restricted settings, confirm, then return to Usage access and enable TimeLens. Notifications are optional. Samsung-specific restricted settings still require confirmation on the phone.\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
