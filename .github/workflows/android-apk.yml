name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test and build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # Current tools read the Android 17 package metadata (37.0).
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Use pinned Android tools for emulators
        run: |
          # emulator-runner prepends cmdline-tools/latest; the runner's preinstalled
          # version cannot read current Android 17 SDK/image metadata.
          tools_path="$ANDROID_HOME/cmdline-tools"
          test -x "$tools_path/16111833/bin/avdmanager"
          if [[ -e "$tools_path/latest" || -L "$tools_path/latest" ]]; then
            mv "$tools_path/latest" "$tools_path/preinstalled-before-timelens"
          fi
          ln -s "$tools_path/16111833" "$tools_path/latest"
          cat "$tools_path/latest/source.properties"

      - name: Verify counting logic
        run: bash scripts/test-counting.sh

      - name: Compile, package and verify APK
        id: build
        run: bash scripts/build-apk.sh

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify permission setup on Android 17
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # Google's stable Android 17 SDK/image package is named 37.0.
          api-level: '37.0'
          # Modern software rendering avoids the legacy DMA/readback crash in SurfaceFlinger.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          avd-name: timelens-api-37-0
          disk-size: 6G
          ram-size: 4096M
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          script: bash scripts/test-permissions-device.sh

      - name: Verify permission setup on Android 15
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          avd-name: timelens-api-35
          disk-size: 6G
          ram-size: 4096M
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          script: bash scripts/test-permissions-device.sh

      - name: Verify permission setup on Android 16
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          avd-name: timelens-api-36
          disk-size: 6G
          ram-size: 4096M
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          script: bash scripts/test-permissions-device.sh

      - name: Upload permission test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: permission-test-evidence
          path: build/permission-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload downloadable APK
        id: apk
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/sdk/TimeLens-*-debug.apk
          # A direct .apk download is easier to install on an Android phone.
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to run summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### TimeLens APK\n\n[Download the APK](%s)\n\nOpen TimeLens and follow permission setup. If Usage access is blocked: App info → ⋮ → Allow restricted settings, confirm, then return to Usage access. Notifications are optional.\n\nCounting checks and permission-flow tests on Android 15, 16 and 17 passed. Samsung-specific restricted settings still require confirmation on the phone.\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
